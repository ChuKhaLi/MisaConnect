title: MisaConnect
description: Community .NET SDK for MISA cloud APIs — EInvoice and ESign
url: https://chung-nd.id.vn
baseurl: /MisaConnect

remote_theme: just-the-docs/just-the-docs@v0.10.1

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

logo: /assets/images/icon.png
favicon_ico: /assets/images/icon.png

color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

aux_links:
  "GitHub": https://github.com/ChuKhaLi/MisaConnect
  "EInvoice on NuGet": https://www.nuget.org/packages/MisaConnect.EInvoice
  "ESign on NuGet": https://www.nuget.org/packages/MisaConnect.ESign

aux_links_new_tab: true

footer_content: "MisaConnect — MIT license. Community project, not affiliated with MISA JSC."

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

exclude:
  - misa-api-reference/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
