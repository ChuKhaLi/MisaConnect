name: tls-diag
# Temporary credential-free diagnostics for Node → MISA sandbox ECONNRESET. Delete after use.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node .github/diag/tls-probe.mjs
      - run: curl -sS -o /dev/null -w "curl HTTP %{http_code}\n" https://testapi.meinvoice.vn/api/integration/
