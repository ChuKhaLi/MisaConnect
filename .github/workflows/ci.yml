name: ci

on:
  push:
    branches: [ main ]
    paths:
      - "src/dotnet/**"
      - "tests/dotnet/**"
      - "samples/dotnet/**"
      - "MisaConnect.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "nuget.config"
      - ".editorconfig"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/dotnet/**"
      - "tests/dotnet/**"
      - "samples/dotnet/**"
      - "MisaConnect.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "nuget.config"
      - ".editorconfig"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional --filter expression (leave blank to run all unit tests)"
        required: false
        default: ""
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MisaConnect.slnx

      # Gate for the CONTRIBUTING rule "dotnet format before PR". Runs on Linux, where the
      # checkout is LF like .editorconfig (end_of_line = lf); on Windows checkouts with
      # core.autocrlf=true the same command reports ENDOFLINE noise only.
      - name: Format check
        run: dotnet format MisaConnect.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Build
        run: dotnet build MisaConnect.slnx --no-restore --configuration ${{ inputs.configuration || 'Release' }}

      - name: Unit tests (EInvoice)
        run: dotnet test tests/dotnet/MisaConnect.EInvoice.UnitTests/MisaConnect.EInvoice.UnitTests.csproj --no-build --configuration ${{ inputs.configuration || 'Release' }} ${{ inputs.test_filter && format('--filter "{0}"', inputs.test_filter) || '' }} --logger "trx;LogFileName=einvoice-unit-tests.trx" --results-directory artifacts/test-results

      - name: Unit tests (ESign)
        run: dotnet test tests/dotnet/MisaConnect.ESign.UnitTests/MisaConnect.ESign.UnitTests.csproj --no-build --configuration ${{ inputs.configuration || 'Release' }} ${{ inputs.test_filter && format('--filter "{0}"', inputs.test_filter) || '' }} --logger "trx;LogFileName=esign-unit-tests.trx" --results-directory artifacts/test-results

      # Fake-server + sample-host integration tests. No network: [SandboxFact] tests skip
      # because MISACONNECT_*SANDBOX_* secrets are not exposed to this workflow
      # (real sandbox runs live in integration.yml).
      - name: Integration tests (EInvoice, no sandbox)
        run: dotnet test tests/dotnet/MisaConnect.EInvoice.IntegrationTests/MisaConnect.EInvoice.IntegrationTests.csproj --no-build --configuration ${{ inputs.configuration || 'Release' }} --logger "trx;LogFileName=einvoice-integration-tests.trx" --results-directory artifacts/test-results

      - name: Integration tests (ESign, no sandbox)
        run: dotnet test tests/dotnet/MisaConnect.ESign.IntegrationTests/MisaConnect.ESign.IntegrationTests.csproj --no-build --configuration ${{ inputs.configuration || 'Release' }} --logger "trx;LogFileName=esign-integration-tests.trx" --results-directory artifacts/test-results

      # A broken skippable-fact setup does not fail: the ESign sandbox tests just vanish from
      # discovery and CI stays green (e.g. Xunit.SkippableFact 1.5.x, or a SandboxFact
      # constructor argument). Fail loudly if any of them stop being discovered.
      - name: Guard ESign sandbox test discovery
        run: |
          listed=$(dotnet test tests/dotnet/MisaConnect.ESign.IntegrationTests/MisaConnect.ESign.IntegrationTests.csproj --no-build --configuration ${{ inputs.configuration || 'Release' }} --list-tests)
          missing=0
          for t in SignXmlSandboxTests SignWordSandboxTests SignExcelSandboxTests SignViaWebhookSandboxTests TwoFactorAuthSandboxTests; do
            if ! grep -q "Sandbox\.$t\." <<<"$listed"; then echo "::error::ESign sandbox test class $t is not discovered"; missing=1; fi
          done
          exit $missing

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
