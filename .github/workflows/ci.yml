name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore MisaConnect.slnx

      - name: Build
        run: dotnet build MisaConnect.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test MisaConnect.slnx --no-build --configuration Release --filter "Category!=Integration" --logger "trx;LogFileName=unit-tests.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
