name: release

on:
  push:
    tags:
      - "v*"

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: ver
        run: |
          REF="${GITHUB_REF#refs/tags/v}"
          echo "version=$REF" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore MisaConnect.slnx

      - name: Build
        run: dotnet build MisaConnect.slnx --no-restore --configuration Release -p:Version=${{ steps.ver.outputs.version }}

      - name: Unit tests (EInvoice)
        run: dotnet test tests/MisaConnect.EInvoice.UnitTests/MisaConnect.EInvoice.UnitTests.csproj --no-build --configuration Release

      - name: Unit tests (ESign)
        run: dotnet test tests/MisaConnect.ESign.UnitTests/MisaConnect.ESign.UnitTests.csproj --no-build --configuration Release

      - name: Pack (EInvoice)
        run: dotnet pack src/MisaConnect.EInvoice.Client/MisaConnect.EInvoice.Client.csproj --configuration Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts

      - name: Pack (ESign)
        run: dotnet pack src/MisaConnect.ESign.Client/MisaConnect.ESign.Client.csproj --configuration Release -p:Version=${{ steps.ver.outputs.version }} -o artifacts

      - name: NuGet login (OIDC -> temp API key)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ChuKhaLi

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > RELEASE_NOTES.md
          gh release create "v$VERSION" \
            --title "MisaConnect.ESign $VERSION" \
            --notes-file RELEASE_NOTES.md \
            artifacts/*.nupkg artifacts/*.snupkg

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
