name: release-ts

# Publishes @misaconnect/einvoice to npm when an `einvoice-ts-v*` tag is pushed.
on:
  push:
    tags:
      - "einvoice-ts-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w @misaconnect/einvoice
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./src/typescript/einvoice/package.json').version")"
          if [ "$TAG" != "einvoice-ts-v$version" ]; then
            echo "Tag '$TAG' does not match package version '$version' (expected einvoice-ts-v$version)." >&2
            exit 1
          fi
      - run: npm publish -w @misaconnect/einvoice --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
