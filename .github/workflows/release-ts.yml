name: release-ts

# Publishes @misaconnect/einvoice to npm when an `einvoice-ts-v*` tag is pushed.
# Tag-push only: there is deliberately no workflow_dispatch, so a manual run from a
# branch can never publish whatever version happens to be on that ref.
on:
  push:
    tags:
      - "einvoice-ts-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      # No `registry-url`: setup-node would then write an .npmrc auth line and a placeholder
      # NODE_AUTH_TOKEN, which overrides OIDC. The default registry is registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm CLI with trusted-publishing support (>= 11.5.1)
        run: npm install -g npm@11 && npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w @misaconnect/einvoice
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/einvoice-ts-v*) ;;
            *) echo "Refusing to publish from ref '$GITHUB_REF' (expected refs/tags/einvoice-ts-v*)." >&2; exit 1 ;;
          esac
          version="$(node -p "require('./src/typescript/einvoice/package.json').version")"
          if [ "$TAG" != "einvoice-ts-v$version" ]; then
            echo "Tag '$TAG' does not match package version '$version' (expected einvoice-ts-v$version)." >&2
            exit 1
          fi
      - run: npm run build -w @misaconnect/einvoice
      # Trusted publishing: npm exchanges the GitHub OIDC token for a short-lived publish
      # credential — no NPM_TOKEN secret. Requires the trusted publisher to be configured on
      # npmjs.com (owner ChuKhaLi, repo MisaConnect, workflow release-ts.yml, environment
      # npm-publish). Provenance is attached automatically.
      - if: startsWith(github.ref, 'refs/tags/einvoice-ts-v')
        run: npm publish -w @misaconnect/einvoice --access public
