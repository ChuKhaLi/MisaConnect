name: integration

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional --filter expression (leave blank to run all integration tests)"
        required: false
        default: ""
      configuration:
        description: "Build configuration"
        required: false
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC

jobs:
  sandbox-tests:
    runs-on: ubuntu-latest
    environment: misa-sandbox
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MisaConnect.slnx

      - name: Build
        run: dotnet build MisaConnect.slnx --no-restore --configuration ${{ inputs.configuration || 'Release' }}

      # Path-MTU blackhole from GitHub runners (outside Vietnam) to MISA: requests over ~1.4 KB
      # (every bearer-authenticated call) hang until HttpClient.Timeout. MTU 1280 fixes it.
      # Same step as ts-sandbox.yml; see src/typescript/einvoice/README.md "Network / TLS".
      - name: Lower MTU (path-MTU blackhole to MISA)
        run: sudo ip link set dev eth0 mtu 1280

      - name: Integration tests (EInvoice)
        env:
          Misa__EInvoice__Environment: Sandbox
          Misa__EInvoice__BaseUrl: https://testapi.meinvoice.vn/api/integration
          Misa__EInvoice__TaxCode: ${{ secrets.MISA_TAX_CODE }}
          Misa__EInvoice__UserName: ${{ secrets.MISA_USERNAME }}
          Misa__EInvoice__Password: ${{ secrets.MISA_PASSWORD }}
          Misa__EInvoice__AppId: ${{ secrets.MISA_APP_ID }}
          MISACONNECT_SANDBOX_TAXCODE: ${{ secrets.MISA_TAX_CODE }}
          MISACONNECT_SANDBOX_USERNAME: ${{ secrets.MISA_USERNAME }}
          MISACONNECT_SANDBOX_PASSWORD: ${{ secrets.MISA_PASSWORD }}
          MISACONNECT_SANDBOX_APPID: ${{ secrets.MISA_APP_ID }}
        run: dotnet test tests/dotnet/MisaConnect.EInvoice.IntegrationTests/MisaConnect.EInvoice.IntegrationTests.csproj --no-build --configuration ${{ inputs.configuration || 'Release' }} ${{ inputs.test_filter && format('--filter "{0}"', inputs.test_filter) || '' }} --logger "trx;LogFileName=einvoice-integration-tests.trx" --results-directory artifacts/test-results

      - name: Integration tests (ESign)
        env:
          MISACONNECT_ESIGN_SANDBOX_BASE_URL: ${{ secrets.MISA_ESIGN_BASE_URL }}
          MISACONNECT_ESIGN_SANDBOX_CLIENT_ID: ${{ secrets.MISA_ESIGN_CLIENT_ID }}
          MISACONNECT_ESIGN_SANDBOX_CLIENT_KEY: ${{ secrets.MISA_ESIGN_CLIENT_KEY }}
          MISACONNECT_ESIGN_SANDBOX_USERNAME: ${{ secrets.MISA_ESIGN_USERNAME }}
          MISACONNECT_ESIGN_SANDBOX_PASSWORD: ${{ secrets.MISA_ESIGN_PASSWORD }}
          # Not required yet: the sandbox account has no ACTIVE remote-signing certificate. Without
          # REQUIRED, the sign tests skip (not fail) on NoActiveCertificateException (see
          # Sandbox/SandboxSigning.cs; mirrors ts-sandbox.yml). Add
          # MISACONNECT_ESIGN_SANDBOX_REQUIRED: '1' once it has one, so that skip becomes a failure.
        run: dotnet test tests/dotnet/MisaConnect.ESign.IntegrationTests/MisaConnect.ESign.IntegrationTests.csproj --no-build --configuration ${{ inputs.configuration || 'Release' }} ${{ inputs.test_filter && format('--filter "{0}"', inputs.test_filter) || '' }} --logger "trx;LogFileName=esign-integration-tests.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/test-results
