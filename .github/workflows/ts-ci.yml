name: ts-ci

# TypeScript packages under src/typescript/*. .NET has its own path-filtered ci.yml.
on:
  push:
    branches: [ main ]
    paths:
      - "src/typescript/**"
      - "samples/typescript/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".nvmrc"
      - ".gitattributes"
      - ".github/workflows/ts-ci.yml"
      - ".github/scripts/**"
  pull_request:
    branches: [ main ]
    paths:
      - "src/typescript/**"
      - "samples/typescript/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "eslint.config.mjs"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".nvmrc"
      - ".gitattributes"
      - ".github/workflows/ts-ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files via the API

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      einvoice: ${{ steps.filter.outputs.einvoice }}
      esign: ${{ steps.filter.outputs.esign }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            shared: &shared
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"
              - "eslint.config.mjs"
              - ".prettierrc.json"
              - ".prettierignore"
              - ".nvmrc"
              - ".gitattributes"
              - ".github/workflows/ts-ci.yml"
              - ".github/scripts/**"
              - "samples/typescript/**"
            einvoice:
              - *shared
              - "src/typescript/einvoice/**"
            esign:
              - *shared
              - "src/typescript/esign/**"

  # Lint + format once for the whole workspace.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json packageManager
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      # Release tag → workspace mapping used by release-ts.yml (fixed strings only).
      - run: bash .github/scripts/ts-release-target.sh --self-test

  einvoice:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.einvoice == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @misaconnect/einvoice run typecheck
      - run: pnpm --filter @misaconnect/einvoice run test
      - run: pnpm --filter @misaconnect/einvoice run smoke
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: einvoice-dist
          path: src/typescript/einvoice/dist
          retention-days: 1

  # Oldest supported runtime (package engines >=22): the exact 22.0.0 release. The dev toolchain
  # needs Node >=22.18, so the package is built above and only the built output is exercised here.
  einvoice-node22-min:
    needs: einvoice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: einvoice-dist
          path: src/typescript/einvoice/dist
      - uses: actions/setup-node@v7
        with:
          node-version: '22.0.0'
      - name: Link workspace package without installing dev tooling
        run: mkdir -p node_modules/@misaconnect && ln -s ../../src/typescript/einvoice node_modules/@misaconnect/einvoice
      # No pnpm here: the dev toolchain needs Node >= 22.18. npm runs the package script from its directory.
      - working-directory: src/typescript/einvoice
        run: node --version && npm run smoke

  esign:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.esign == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @misaconnect/esign run typecheck
      - run: pnpm --filter @misaconnect/esign run test
      - run: pnpm --filter @misaconnect/esign run smoke
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: esign-dist
          path: src/typescript/esign/dist
          retention-days: 1

  # Oldest supported runtime (package engines >=22); see einvoice-node22-min.
  esign-node22-min:
    needs: esign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: esign-dist
          path: src/typescript/esign/dist
      - uses: actions/setup-node@v7
        with:
          node-version: '22.0.0'
      - name: Link workspace package without installing dev tooling
        run: mkdir -p node_modules/@misaconnect && ln -s ../../src/typescript/esign node_modules/@misaconnect/esign
      # No pnpm here: the dev toolchain needs Node >= 22.18. npm runs the package script from its directory.
      - working-directory: src/typescript/esign
        run: node --version && npm run smoke
