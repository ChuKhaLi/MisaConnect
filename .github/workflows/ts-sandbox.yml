name: ts-sandbox

# Live MISA sandbox tests for @misaconnect/einvoice and @misaconnect/esign (test/sandbox/**).
# Uses the same `misa-sandbox` environment secrets as the .NET integration.yml.
# Not part of ts-ci: they talk to the real sandbox, create drafts and clean them up.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1" # Monday 06:30 UTC, after the .NET integration run

permissions:
  contents: read

concurrency:
  group: misa-sandbox-ts
  cancel-in-progress: false

jobs:
  einvoice-sandbox:
    name: einvoice-sandbox (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    environment: misa-sandbox
    strategy:
      fail-fast: false
      # One leg at a time: both legs create and delete drafts in the same sandbox account.
      max-parallel: 1
      matrix:
        # Node 22 / 24 ship OpenSSL 3.5 (post-quantum key share by default), which is what the
        # default TLS settings must cope with. Node 20 is a supported runtime but cannot run the
        # dev toolchain (tsup / vitest need >= 22.18); ts-ci covers it with the dist smoke test.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @misaconnect/einvoice
      # The path from GitHub runners (outside Vietnam) to MISA is a path-MTU blackhole: TCP
      # segments near 1500 B are dropped and the ICMP that would shrink them never arrives, so
      # any request over ~1.4 KB (every authenticated call: the bearer JWT alone is ~2 KB) hangs
      # and is reset. Verified 2026-11-03 with curl and node:https; MTU 1280 fixes both.
      - name: Lower MTU (path-MTU blackhole to MISA)
        run: sudo ip link set dev eth0 mtu 1280
      # No credentials: shows whether this runner can reach the sandbox at all (DNS/TCP/TLS/HTTP).
      - name: Probe sandbox host
        continue-on-error: true
        run: |
          curl -sS -o /dev/null --max-time 20 -w "curl: HTTP %{http_code}, ip %{remote_ip}, tls_verify %{ssl_verify_result}, total %{time_total}s\n" https://testapi.meinvoice.vn/api/integration/ || echo "curl exit $?"
          node -e "fetch('https://testapi.meinvoice.vn/api/integration/',{signal:AbortSignal.timeout(20000)}).then(r=>console.log('node fetch: HTTP',r.status)).catch(e=>console.log('node fetch error:',e.message,'| cause:',e.cause?.code ?? e.cause?.name,e.cause?.message))"
      - name: Sandbox tests
        env:
          MISACONNECT_SANDBOX_TAXCODE: ${{ secrets.MISA_TAX_CODE }}
          MISACONNECT_SANDBOX_USERNAME: ${{ secrets.MISA_USERNAME }}
          MISACONNECT_SANDBOX_PASSWORD: ${{ secrets.MISA_PASSWORD }}
          MISACONNECT_SANDBOX_APPID: ${{ secrets.MISA_APP_ID }}
          # Fail instead of skipping when credentials are missing or the host is unreachable.
          MISACONNECT_SANDBOX_REQUIRED: '1'
        run: npm run test:sandbox -w @misaconnect/einvoice

  esign-sandbox:
    name: esign-sandbox (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    environment: misa-sandbox
    strategy:
      fail-fast: false
      # One leg at a time: both legs sign against the same sandbox account.
      max-parallel: 1
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @misaconnect/esign
      # Same path-MTU blackhole to MISA as the einvoice job above.
      - name: Lower MTU (path-MTU blackhole to MISA)
        run: sudo ip link set dev eth0 mtu 1280
      - name: Sandbox tests
        env:
          MISACONNECT_ESIGN_SANDBOX_BASE_URL: ${{ secrets.MISA_ESIGN_BASE_URL }}
          MISACONNECT_ESIGN_SANDBOX_CLIENT_ID: ${{ secrets.MISA_ESIGN_CLIENT_ID }}
          MISACONNECT_ESIGN_SANDBOX_CLIENT_KEY: ${{ secrets.MISA_ESIGN_CLIENT_KEY }}
          MISACONNECT_ESIGN_SANDBOX_USERNAME: ${{ secrets.MISA_ESIGN_USERNAME }}
          MISACONNECT_ESIGN_SANDBOX_PASSWORD: ${{ secrets.MISA_ESIGN_PASSWORD }}
          # Not required yet: the sandbox account has no ACTIVE remote-signing certificate.
          # Add MISACONNECT_ESIGN_SANDBOX_REQUIRED: '1' (fail instead of skip) once it has one.
        run: npm run test:sandbox -w @misaconnect/esign
