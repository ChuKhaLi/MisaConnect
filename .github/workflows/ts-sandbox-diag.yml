# TEMPORARY: diagnoses ECONNRESET on authenticated MISA sandbox calls from GitHub runners.
# Manual only. Prints status codes, sizes, timings and error codes; never tokens or bodies.
# Remove together with .github/diag/ once the findings are recorded.
name: ts-sandbox-diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: misa-sandbox
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        node: [22, 24]
    env:
      MISACONNECT_SANDBOX_TAXCODE: ${{ secrets.MISA_TAX_CODE }}
      MISACONNECT_SANDBOX_USERNAME: ${{ secrets.MISA_USERNAME }}
      MISACONNECT_SANDBOX_PASSWORD: ${{ secrets.MISA_PASSWORD }}
      MISACONNECT_SANDBOX_APPID: ${{ secrets.MISA_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Runner network
        run: |
          curl -sS --max-time 10 https://api.ipify.org && echo " (runner public IP)"
          ip link show | grep -E "mtu" | head -3
      - name: curl (OpenSSL of the runner)
        continue-on-error: true
        run: |
          B=https://testapi.meinvoice.vn/api/integration
          W="${MISACONNECT_SANDBOX_TAXCODE}-${MISACONNECT_SANDBOX_APPID}"
          BODY=$(jq -nc --arg t "$W" --arg u "$MISACONNECT_SANDBOX_USERNAME" --arg p "$MISACONNECT_SANDBOX_PASSWORD" '{taxcode:$t,username:$u,password:$p}')
          curl -sS --max-time 30 -o tok.json -w "curl token: HTTP %{http_code}, %{size_download} B, %{time_total}s\n" -X POST "$B/webapp/token" -H 'Content-Type: application/json' -d "$BODY" || echo "curl token exit $?"
          TOKEN=$(jq -r '.data | fromjson | .access_token' tok.json 2>/dev/null || true)
          rm -f tok.json
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN" && echo "curl token obtained (${#TOKEN} chars)" || { echo "no token"; exit 0; }
          TB=$(jq -nc --arg t "$W" --arg u "$MISACONNECT_SANDBOX_USERNAME" --arg p "$MISACONNECT_SANDBOX_PASSWORD" '{TaxCode:$t,UserName:$u,Password:$p}')
          curl -sS --max-time 30 -o /dev/null -w "curl templates bearer: HTTP %{http_code}, %{size_download} B, %{time_total}s\n" -X POST "$B/webapp/templates?invoiceWithCode=true&isTicket=false" -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" -H "taxcode: $W" -d "$TB" || echo "curl templates exit $?"
          curl -sS --max-time 30 -o /dev/null -w "curl templates no-bearer: HTTP %{http_code}, %{size_download} B, %{time_total}s\n" -X POST "$B/webapp/templates?invoiceWithCode=true&isTicket=false" -H 'Content-Type: application/json' -H "taxcode: $W" -d "$TB" || echo "curl templates no-bearer exit $?"
      - name: node:https probes
        run: node .github/diag/sandbox-diag.mjs
      # Hypothesis: path-MTU blackhole (segments > path MTU dropped, ICMP filtered). Single change:
      # lower the interface MTU so every TCP segment fits, then repeat the same probes.
      - name: Lower MTU to 1280
        run: |
          sudo ip link set dev eth0 mtu 1280
          ip link show eth0 | grep -o "mtu [0-9]*"
      - name: curl after MTU 1280
        continue-on-error: true
        run: |
          B=https://testapi.meinvoice.vn/api/integration
          W="${MISACONNECT_SANDBOX_TAXCODE}-${MISACONNECT_SANDBOX_APPID}"
          BODY=$(jq -nc --arg t "$W" --arg u "$MISACONNECT_SANDBOX_USERNAME" --arg p "$MISACONNECT_SANDBOX_PASSWORD" '{taxcode:$t,username:$u,password:$p}')
          TOKEN=$(curl -sS --max-time 30 -X POST "$B/webapp/token" -H 'Content-Type: application/json' -d "$BODY" | jq -r '.data | fromjson | .access_token' 2>/dev/null || true)
          [ -n "$TOKEN" ] && echo "::add-mask::$TOKEN" && echo "curl token obtained (${#TOKEN} chars)" || { echo "no token"; exit 0; }
          TB=$(jq -nc --arg t "$W" --arg u "$MISACONNECT_SANDBOX_USERNAME" --arg p "$MISACONNECT_SANDBOX_PASSWORD" '{TaxCode:$t,UserName:$u,Password:$p}')
          curl -sS --max-time 30 -o /dev/null -w "curl templates bearer (mtu 1280): HTTP %{http_code}, %{size_download} B, %{time_total}s\n" -X POST "$B/webapp/templates?invoiceWithCode=true&isTicket=false" -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" -H "taxcode: $W" -d "$TB" || echo "curl templates exit $?"
      - name: node:https probes after MTU 1280
        run: node .github/diag/sandbox-diag.mjs
