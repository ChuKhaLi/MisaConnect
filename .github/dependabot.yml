version: 2
updates:
  # npm workspace root: src/typescript/* packages (zero runtime deps) + samples/typescript/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # .NET: central package management in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to 1.4.13: with xunit 2.4.2 + xunit.runner.visualstudio 2.8.2, 1.5.x test cases
      # are not mapped back to VS test cases, so the ESign sandbox tests silently vanish from
      # dotnet test output while CI stays green. See the comment in Directory.Packages.props.
      - dependency-name: Xunit.SkippableFact
        versions: [">= 1.5.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
