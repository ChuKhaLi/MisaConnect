version: 2
updates:
  # npm workspace root: src/typescript/* packages (zero runtime deps) + samples/typescript/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # .NET: central package management in Directory.Packages.props.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
    ignore:
      # xunit.v3 4.x / runner 4.x need the Microsoft Testing Platform `dotnet test` mode, which
      # changes every CI test command. See the comment in Directory.Packages.props.
      - dependency-name: xunit.v3
        versions: [">= 4.0.0"]
      - dependency-name: xunit.runner.visualstudio
        versions: [">= 4.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
